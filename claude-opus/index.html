<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Istanbul — a tiny living city</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e30a17'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;800&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #2a3038; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe8ec; transition: background 2s linear; }
  body { display: grid; place-items: center; font-family: 'Outfit', 'Avenir Next', 'Futura', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1080px; height: 1080px; --k: 1; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #c { width: 100%; height: 100%; display: block; cursor: grab; outline: none; }
  #c:active { cursor: grabbing; }
  #hud { position: absolute; left: 0; right: 0; top: calc(46px * var(--k)); display: flex; flex-direction: column; align-items: center; pointer-events: none; color: var(--ink); transition: color 2s linear; --halo: #dfe8ec; }
  #date, #temp, #title { text-shadow: 0 0 calc(10px * var(--k)) var(--halo), 0 0 calc(22px * var(--k)) var(--halo), 0 0 calc(3px * var(--k)) var(--halo); }
  #title { margin: 0; font-weight: 800; font-size: calc(104px * var(--k)); letter-spacing: 0.14em; line-height: 1; padding-left: 0.14em; opacity: 0; transform: translateY(8px); transition: opacity 1.2s ease, transform 1.2s ease; }
  #title[data-ready] { opacity: 0.94; transform: none; }
  #icon { width: calc(84px * var(--k)); height: calc(84px * var(--k)); margin-top: calc(14px * var(--k)); pointer-events: auto; filter: drop-shadow(0 calc(3px * var(--k)) calc(6px * var(--k)) rgba(0,0,0,0.12)); }
  #icon svg { width: 100%; height: 100%; overflow: visible; }
  #date { margin-top: calc(10px * var(--k)); font-size: calc(17px * var(--k)); font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.78; }
  #temp { margin-top: calc(8px * var(--k)); font-size: calc(40px * var(--k)); font-weight: 500; letter-spacing: 0.04em; pointer-events: auto; }
  #tip { position: absolute; left: 0; top: 0; pointer-events: none; padding: calc(7px * var(--k)) calc(12px * var(--k)); margin: calc(16px * var(--k)) 0 0 calc(14px * var(--k)); border-radius: 999px; background: rgba(255,255,255,0.86); color: #26323c; font-size: calc(14px * var(--k)); white-space: nowrap; box-shadow: 0 4px 18px rgba(20,30,40,0.16); backdrop-filter: blur(6px); opacity: 0; transition: opacity .18s ease; }
  #tip.on { opacity: 1; }
  #tip b { font-weight: 600; margin-right: .5em; }
  #tip span { opacity: .65; }
  #fps { position: absolute; left: 8px; bottom: 6px; font: 11px ui-monospace, monospace; color: var(--ink); opacity: .6; }
  /* icon motion */
  .spin { transform-origin: 32px 32px; animation: spin 40s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .drift { animation: drift 6s ease-in-out infinite alternate; }
  .d2 { animation-delay: -2s; }
  @keyframes drift { from { transform: translateX(-1.5px); } to { transform: translateX(1.5px); } }
  .drop { animation: drop 0.9s linear infinite; }
  .flake { animation: flake 2.6s linear infinite; }
  .d1 { animation-delay: -.3s } .d2 { animation-delay: -.6s } .d3 { animation-delay: -.45s }
  @keyframes drop { from { transform: translateY(-5px); opacity: 0 } 30% { opacity: 1 } to { transform: translateY(5px); opacity: 0 } }
  @keyframes flake { from { transform: translateY(-6px); opacity: 0 } 30% { opacity: 1 } to { transform: translate(2px, 6px); opacity: 0 } }
  .bolt { animation: bolt 3.2s steps(1) infinite; }
  @keyframes bolt { 0%, 86%, 100% { opacity: .35 } 88%, 92% { opacity: 1 } 90% { opacity: .2 } }
  .tw { animation: tw 3s ease-in-out infinite alternate; }
  @keyframes tw { from { opacity: .2 } to { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .spin, .drift, .drop, .flake, .bolt, .tw { animation: none; } }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud">
      <h1 id="title">ISTANBUL</h1>
      <div id="icon"></div>
      <div id="date"></div>
      <div id="temp"></div>
    </div>
    <div id="tip"></div>
    <div id="fps"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
